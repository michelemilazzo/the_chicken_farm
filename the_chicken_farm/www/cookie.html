{% extends "templates/web.html" %}

{% block title %}Cookie Policy · The Chicken Farm{% endblock %}

{% block head_include %}
<meta name="description" content="Cookie policy di The Chicken Farm (BMAS S.r.l.): cookie tecnici e di carrello del negozio online, cookie analitici previo consenso, ai sensi dell'art. 122 del Codice Privacy.">
{% endblock %}

{% block page_content %}
{% from "mmos_brand/templates/includes/legal.html" import cookie_policy_shop %}
<div class="tcf-legal-theme">
  <style>
    /* Override dark BK-style della .mmos-legal centralizzata, per coerenza col sito TCF */
    .tcf-legal-theme { background:#070707; min-height:100vh; }
    .tcf-legal-theme .mmos-legal { color:#c3bcb1; font-family:Nunito,-apple-system,sans-serif; }
    .tcf-legal-theme .mmos-legal-kicker { color:#c89b3c; }
    .tcf-legal-theme .mmos-legal h1 { color:#f6efe4; font-family:Oswald,Impact,sans-serif; text-transform:uppercase; letter-spacing:2px; }
    .tcf-legal-theme .mmos-legal-meta { color:#8f887d; border-bottom-color:rgba(200,155,60,.18); }
    .tcf-legal-theme .mmos-legal h2 { color:#f6efe4; font-family:Oswald,Impact,sans-serif; text-transform:uppercase; letter-spacing:1.2px; border-top:1px solid rgba(200,155,60,.14); padding-top:20px; }
    .tcf-legal-theme .mmos-legal strong { color:#f6efe4; }
    .tcf-legal-theme .mmos-legal a { color:#c89b3c; }
    .tcf-legal-theme .mmos-legal-back { color:#f6efe4; }
  </style>
  {{ cookie_policy_shop(company, anno) }}
</div>
{% endblock %}
