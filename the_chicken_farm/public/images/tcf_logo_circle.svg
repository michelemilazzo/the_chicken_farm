<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Brown circle background -->
  <circle cx="100" cy="100" r="96" fill="#2B1A0A"/>

  <!-- Compass cross arms -->
  <rect x="98" y="60" width="4" height="80" fill="#F5F0E8" rx="1"/>
  <rect x="40" y="98" width="120" height="4" fill="#F5F0E8" rx="1"/>

  <!-- Arrowhead right (N) -->
  <polygon points="160,98 152,93 152,103" fill="#F5F0E8"/>
  <!-- Arrowhead left (S) -->
  <polygon points="40,100 48,95 48,105" fill="#F5F0E8"/>

  <!-- S label -->
  <text x="50" y="116" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F5F0E8" text-anchor="middle">S</text>
  <!-- N label -->
  <text x="148" y="116" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F5F0E8" text-anchor="middle">N</text>

  <!-- Rooster body -->
  <ellipse cx="100" cy="80" rx="18" ry="22" fill="#F5F0E8"/>
  <!-- Rooster head -->
  <circle cx="113" cy="62" r="10" fill="#F5F0E8"/>
  <!-- Beak -->
  <polygon points="123,61 129,63 123,65" fill="#F5F0E8"/>
  <!-- Eye -->
  <circle cx="116" cy="60" r="2" fill="#2B1A0A"/>
  <circle cx="116.5" cy="59.5" r=".6" fill="#F5F0E8"/>
  <!-- Comb -->
  <path d="M109,54 Q111,48 113,54 Q115,47 117,54 Q119,49 121,54" fill="#F5F0E8" stroke="none"/>
  <!-- Wattle -->
  <ellipse cx="122" cy="67" rx="3" ry="4" fill="#F5F0E8"/>
  <!-- Tail feathers -->
  <path d="M82,68 Q68,52 72,72 Q62,58 70,78 Q60,68 72,82" fill="#F5F0E8" stroke="none"/>
  <!-- Wing -->
  <ellipse cx="97" cy="82" rx="10" ry="7" fill="#2B1A0A" opacity=".25"/>
  <!-- Leg/pole down -->
  <rect x="99" y="100" width="3" height="20" fill="#F5F0E8" rx="1"/>
</svg>
