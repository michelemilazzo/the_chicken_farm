<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cream circle background -->
  <circle cx="100" cy="100" r="96" fill="#F5EDD8" stroke="#2B1A0A" stroke-width="5"/>

  <!-- Compass cross arms -->
  <rect x="98.5" y="58" width="3" height="84" fill="#2B1A0A" rx="1.5"/>
  <rect x="38" y="98.5" width="124" height="3" fill="#2B1A0A" rx="1.5"/>

  <!-- Arrowhead E -->
  <polygon points="162,100 153,95 153,105" fill="#2B1A0A"/>
  <!-- Arrowhead W -->
  <polygon points="38,100 47,95 47,105" fill="#2B1A0A"/>

  <!-- Cardinal labels -->
  <text x="100" y="54" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2B1A0A" text-anchor="middle">N</text>
  <text x="100" y="155" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2B1A0A" text-anchor="middle">S</text>
  <text x="168" y="104" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2B1A0A" text-anchor="middle">E</text>
  <text x="32" y="104" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2B1A0A" text-anchor="middle">W</text>

  <!-- Tail feathers -->
  <path d="M76,72 Q60,52 66,74 Q54,60 64,80 Q52,70 66,86" fill="#8B4513" stroke="#5C2D0A" stroke-width="1"/>

  <!-- Rooster body -->
  <ellipse cx="100" cy="90" rx="20" ry="24" fill="#C8860A" stroke="#8B5A00" stroke-width="1.5"/>

  <!-- Wing detail -->
  <ellipse cx="97" cy="92" rx="12" ry="9" fill="#A06800" stroke="none" opacity=".6"/>

  <!-- Neck -->
  <ellipse cx="112" cy="74" rx="8" ry="10" fill="#C8860A" stroke="#8B5A00" stroke-width="1"/>

  <!-- Head -->
  <circle cx="114" cy="63" r="11" fill="#C8860A" stroke="#8B5A00" stroke-width="1.5"/>

  <!-- Comb -->
  <path d="M108,54 Q110,46 112,53 Q114,44 116,53 Q118,47 120,53" fill="#CC2200" stroke="#990000" stroke-width="1"/>

  <!-- Wattle -->
  <ellipse cx="121" cy="70" rx="4" ry="5" fill="#CC2200" stroke="#990000" stroke-width="1"/>

  <!-- Beak -->
  <polygon points="125,62 133,65 125,68" fill="#E8A020" stroke="#B07800" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="118" cy="61" r="3" fill="#1A0A00"/>
  <circle cx="118.8" cy="60.2" r="1" fill="white"/>

  <!-- Leg/pole down -->
  <rect x="99" y="113" width="3" height="18" fill="#2B1A0A" rx="1"/>
</svg>
